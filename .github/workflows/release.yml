# Checks the plugin on every push. When a tag is pushed, it also builds the
# files of a release, says in a way that can be verified that they were built
# here from this source, and puts them into a release with the name of the tag.
name: Check and release

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may be there already, made by hand. Then the files take the place of the ones it has.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag main.js manifest.json styles.css
          fi
